<text x="24" y="186" fill="#e5e7eb" font-size="13" font-family="monospace">  tekil iyelik  kitabı     kitabını     kitabına     kitabında     kitabından     kitabının     kitabıyla</text>
<text x="24" y="206" fill="#e5e7eb" font-size="13" font-family="monospace">  çoğul iyelik  kitapları  kitaplarını  kitaplarına  kitaplarında  kitaplarından  kitaplarının  kitaplarıyla</text>
