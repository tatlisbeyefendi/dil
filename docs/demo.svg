<text x="24" y="46" fill="#6ee7b7" font-size="14" font-family="monospace">$ dil noun kitap</text>
<text x="24" y="66" fill="#e5e7eb" font-size="13" font-family="monospace">kitap  (yumuşama · düşme yok)</text>
<text x="24" y="86" fill="#e5e7eb" font-size="13" font-family="monospace"></text>
<text x="24" y="106" fill="#e5e7eb" font-size="13" font-family="monospace">                yalın      belirtme     yönelme      bulunma       ayrılma        tamlayan      vasıta</text>
