<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670">
<rect width="100%" height="100%" rx="10" fill="#0f172a"/>
<text x="24" y="30" fill="#93c5fd" font-size="17" font-family="monospace" font-weight="bold">dil 0.2 — çözümle, denetle, ölç</text>
<text x="24" y="46" fill="#6ee7b7" font-size="14" font-family="monospace">$ dil analyze kitaplarımızda gidiyorlar --limit 2</text>
<text x="24" y="66" fill="#e5e7eb" font-size="13" font-family="monospace">  kitaplarımızda</text>
<text x="24" y="86" fill="#e5e7eb" font-size="13" font-family="monospace">    1. kitap + çoğul + 1. çoğul iyelik + bulunma            isim   22.9</text>
<text x="24" y="106" fill="#e5e7eb" font-size="13" font-family="monospace">    2. kitaplarımızd + yönelme                              isim    1.7</text>
<text x="24" y="126" fill="#e5e7eb" font-size="13" font-family="monospace"></text>
<text x="24" y="146" fill="#e5e7eb" font-size="13" font-family="monospace">  gidiyorlar</text>
<text x="24" y="166" fill="#e5e7eb" font-size="13" font-family="monospace">    1. git + şimdiki zaman + 3. çoğul                       fiil   15.0</text>
<text x="24" y="186" fill="#e5e7eb" font-size="13" font-family="monospace">    2. gidiyor + çoğul                                      isim   -0.1</text>
<text x="24" y="226" fill="#6ee7b7" font-size="14" font-family="monospace">$ dil lint --text &quot;...&quot;</text>
<text x="24" y="246" fill="#e5e7eb" font-size="13" font-family="monospace">  yer   kod        açıklama</text>
<text x="24" y="266" fill="#e5e7eb" font-size="13" font-family="monospace">  ----  ---------  ---------------------------------------</text>
<text x="24" y="286" fill="#e5e7eb" font-size="13" font-family="monospace">  1:1   IMLA001    yazım: «herşey» → «her şey»</text>
<text x="24" y="306" fill="#e5e7eb" font-size="13" font-family="monospace">  1:8   IMLA001    yazım: «yanlız» → «yalnız»</text>
<text x="24" y="326" fill="#e5e7eb" font-size="13" font-family="monospace">  1:15  SAYI001    ek uyumu ve kesme: «1923de» → «1923&#x27;te»</text>
<text x="24" y="346" fill="#e5e7eb" font-size="13" font-family="monospace">  1:26  NOKTA001   noktalamadan önce boşluk olmaz</text>
<text x="24" y="366" fill="#e5e7eb" font-size="13" font-family="monospace">  1:29  TEKRAR001  kelime iki kez yazılmış: «ve»</text>
<text x="24" y="386" fill="#e5e7eb" font-size="13" font-family="monospace">  1:40  NOKTA003   üç nokta «…» tek karakterdir</text>
<text x="24" y="406" fill="#e5e7eb" font-size="13" font-family="monospace"></text>
<text x="24" y="426" fill="#e5e7eb" font-size="13" font-family="monospace">  IMLA001 2 · NOKTA001 1 · NOKTA003 1 · SAYI001 1 · TEKRAR001 1</text>
<text x="24" y="466" fill="#6ee7b7" font-size="14" font-family="monospace">$ dil stats --text &quot;...&quot;</text>
<text x="24" y="486" fill="#e5e7eb" font-size="13" font-family="monospace">  kelime        : 17 (16 tekil)</text>
<text x="24" y="506" fill="#e5e7eb" font-size="13" font-family="monospace">  cümle         : 3 · paragraf: 1</text>
<text x="24" y="526" fill="#e5e7eb" font-size="13" font-family="monospace">  ort. cümle    : 5.7 kelime · ort. kelime: 6.5 harf · 2.71 hece</text>
<text x="24" y="546" fill="#e5e7eb" font-size="13" font-family="monospace">  en uzun kelime: türetilebilir (13 harf)</text>
<text x="24" y="566" fill="#e5e7eb" font-size="13" font-family="monospace">  çeşitlilik    : 0.94 · okuma süresi: 0.1 dk</text>
<text x="24" y="586" fill="#e5e7eb" font-size="13" font-family="monospace">  Ateşman       : 75.3 → kolay</text>
<text x="24" y="606" fill="#e5e7eb" font-size="13" font-family="monospace">  sık kelimeler : türkçe (1), sondan (1), eklemeli (1), dildir (1), yüzden (1), kökten (1), onlarca (1), kelime (1)</text>
</svg>
