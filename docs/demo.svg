<text x="24" y="246" fill="#e5e7eb" font-size="13" font-family="monospace">  tek form: kitap</text>
<text x="24" y="286" fill="#6ee7b7" font-size="14" font-family="monospace">$ dil verb gel --tense future --ability</text>
