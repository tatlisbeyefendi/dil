[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dil"
version = "0.1.0"
description = "Türkçe dil motoru: çekim, sayı, hece ve ses olayları — sıfır bağımlılık"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tatlisbeyefendi", email = "coincolicman@gmail.com" }]
keywords = ["turkish", "morphology", "nlp", "cli", "inflection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Natural Language :: Turkish",
]
dependencies = []

[project.scripts]
dil = "dil.cli:main"

[project.urls]
Homepage = "https://github.com/tatlisbeyefendi/dil"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


